apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-review-operator
rules:
  - apiGroups:
      - example.com
    resources:
      - agentreviewrequests
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - example.com
    resources:
      - agentreviewrequests/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
  # Kubernetes RBAC escalation checks require these meta-permissions when
  # operator creates exact per-review Roles and binds them to exact ServiceAccounts.
  # No ClusterRole or ReviewResult write permission is granted.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    verbs:
      - get
      - list
      - watch
      - create
      - escalate
      - bind
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
  - apiGroups:
      - example.com
    resources:
      - reviewresults
    verbs:
      - get
      - list
      - watch
