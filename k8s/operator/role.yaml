apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-review-operator
  namespace: default
rules:
  - apiGroups:
      - example.com
    resources:
      - agentreviewrequests
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - example.com
    resources:
      - agentreviewrequests/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - example.com
    resources:
      - reviewresults
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
