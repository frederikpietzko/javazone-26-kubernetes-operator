apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-review-request-spec-immutable
spec:
  failurePolicy: Fail
  matchConstraints:
    matchConditions:
      - name: default-namespace-only
        expression: request.namespace == "default"
    resourceRules:
      - apiGroups:
          - example.com
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - agentreviewrequests
        scope: Namespaced
  validations:
    - expression: >-
        !has(oldObject.status.phase) ||
        oldObject.status.phase == "Pending" ||
        object.spec == oldObject.spec
      message: AgentReviewRequest spec is immutable after processing starts
