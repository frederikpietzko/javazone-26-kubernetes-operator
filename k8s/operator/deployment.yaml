apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-review-operator
  namespace: default
  labels:
    app.kubernetes.io/name: agent-review-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-review-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-review-operator
    spec:
      serviceAccountName: agent-review-operator
      containers:
        - name: operator
          image: agent-review-operator:latest
          imagePullPolicy: IfNotPresent
